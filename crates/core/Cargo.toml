[package]
name = "linkscope-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
age = "0.11"
async-trait = "0.1"
futures = "0.3"
fs2 = "0.4"
inventory = "0.3"
petgraph = { version = "0.8", features = ["serde-1"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "socks", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.22"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
