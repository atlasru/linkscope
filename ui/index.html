<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkScope</title></head>
<body>
  <div id="app">
    <header>
      <span class="wordmark">LinkScope</span>
      <button id="toggle-left" title="Toggle explorer · Ctrl+B" aria-label="Toggle explorer" class="icon"></button>
      <input id="project-title" aria-label="Project title" value="Untitled" maxlength="160" spellcheck="false">
      <span id="dirty" aria-label="Unsaved changes" hidden>•</span>
      <div class="header-actions">
        <button data-action="new" title="New project" aria-label="New project" class="icon"></button>
        <button data-action="open" title="Open project · Ctrl+O" aria-label="Open project" class="icon"></button>
        <button data-action="save" title="Save project · Ctrl+S" aria-label="Save project" class="icon"></button>
        <button data-action="import" title="Import · Ctrl+I">Import</button>
        <button data-action="palette" title="Commands · Ctrl+K" aria-label="Commands" class="icon"></button>
        <button id="toggle-right" title="Toggle inspector · Ctrl+Shift+B" aria-label="Toggle inspector" class="icon"></button>
      </div>
    </header>
    <main>
      <aside id="explorer" aria-label="Explorer">
        <div class="panel-heading"><span>Entities</span><button data-action="create" title="Add entity · N" aria-label="Add entity" class="icon"></button></div>
        <div class="search-box"><input id="search" type="search" placeholder="Search" aria-label="Search entities" autocomplete="off"><select id="type-filter" aria-label="Filter by type"><option value="">All types</option></select></div>
        <div id="entity-list" role="listbox" aria-label="Entities" aria-multiselectable="true"></div>
        <div id="search-more" class="subtle" hidden>Refine search to see more</div>
        <section id="collections-section" hidden><div class="panel-heading"><span>Collections</span></div><div id="collection-list"></div></section>
      </aside>
      <div id="left-resizer" class="resizer" role="separator" aria-label="Resize explorer" aria-orientation="vertical" tabindex="0"></div>
      <section id="graph" aria-label="Graph workspace">
        <div id="canvas-host"></div>
        <div class="canvas-tools" role="toolbar" aria-label="Graph tools">
          <button id="select-tool" title="Select · V" aria-label="Select tool" class="icon active"></button>
          <button id="link-tool" title="Connect · L · click two entities" aria-label="Connect tool" class="icon"></button>
          <span class="divider"></span>
          <button data-action="create" title="Add entity · N · or double-click canvas" aria-label="Create entity" class="icon"></button>
          <button data-action="layout" title="Arrange graph" aria-label="Arrange graph" class="icon"></button>
          <button data-action="fit" title="Fit graph · F" aria-label="Fit graph" class="icon"></button>
          <span class="divider"></span>
          <button data-action="undo" id="undo" title="Undo · Ctrl+Z" aria-label="Undo" class="icon" disabled></button>
          <button data-action="redo" id="redo" title="Redo · Ctrl+Shift+Z" aria-label="Redo" class="icon" disabled></button>
        </div>
        <div id="empty" hidden><button data-action="create">Add entity</button><button data-action="import">Import file</button></div>
        <div class="zoom-tools"><button data-action="zoom-out" aria-label="Zoom out" title="Zoom out" class="icon"></button><button data-action="zoom-in" aria-label="Zoom in" title="Zoom in" class="icon"></button></div>
        <div id="job" hidden><span id="job-label"></span><button id="cancel-job">Cancel</button></div>
        <div id="notice" role="status" hidden><span></span><button aria-label="Dismiss message" class="icon">×</button></div>
      </section>
      <div id="right-resizer" class="resizer" role="separator" aria-label="Resize inspector" aria-orientation="vertical" tabindex="0"></div>
      <aside id="inspector" aria-label="Inspector"><div class="panel-heading">Inspector</div><div id="inspector-content"></div></aside>
    </main>
  </div>
  <dialog id="editor-dialog"><form id="dialog-form"></form></dialog>
  <dialog id="palette"><input id="command-search" placeholder="Find a command…" aria-label="Find a command" autocomplete="off"><div id="command-list" role="listbox" aria-label="Commands"></div></dialog>
  <div id="context-menu" role="menu" hidden></div>
  <datalist id="entity-types"><option value="entity"><option value="person"><option value="organization"><option value="domain"><option value="ip"><option value="email"><option value="url"><option value="document"><option value="event"><option value="place"></datalist>
  <script type="module" src="/src/main.ts"></script>
</body></html>
