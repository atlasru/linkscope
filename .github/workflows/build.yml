name: Desktop build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
            bundles: nsis
          - platform: linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - platform: macos
            os: macos-14
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: node --test tests/model.test.mjs
      - run: cargo test -p linkscope-core
      - run: npm run build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: linkscope-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
      - name: Preserve resolved dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-locks-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            Cargo.lock
            package-lock.json
